# Builds Mi Bulb on a clean GitHub-hosted runner and publishes it as a
# release: an installer and a portable exe, with SHA-256 checksums and a
# signed build provenance attestation.
#
# To release: bump __version__ in mibulb/__init__.py, then
#   git tag v0.3.0
#   git push origin v0.3.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create the release
  id-token: write       # sign the attestation
  attestations: write   # store the attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches version
        shell: pwsh
        run: |
          $version = python -c "import mibulb; print(mibulb.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match mibulb.__version__ ($version)"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Build portable exe and installer
        shell: pwsh
        run: ./build.ps1 -RequireInstaller

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-FileHash MiBulb-Setup.exe, MiBulb-Portable.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/MiBulb-Setup.exe
            dist/MiBulb-Portable.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MiBulb-Setup.exe
            dist/MiBulb-Portable.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
