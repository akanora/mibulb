name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        # 3.13 is there to catch Tkinter changes that the translator relies on
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      # Includes tests/test_windows.py, which drives the real windows (hidden) against simulated bulbs
      - run: python -m unittest discover -s tests -v

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyflakes==3.2.0
      - run: python -m pyflakes mibulb tests

  # Builds the installer on every push, so packaging problems show up before a release.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: choco install innosetup --no-progress -y
      - run: ./build.ps1 -RequireInstaller
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: mibulb-windows
          path: |
            dist/MiBulb-Setup.exe
            dist/MiBulb-Portable.exe
          retention-days: 7
